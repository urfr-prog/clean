<title>Totems africains v6</title>
<!--
  =====================================================================
  REGLE DE DIFFICULTE (CŒUR DU JEU — A RESPECTER STRICTEMENT)
  =====================================================================
  Un totem N'EST PAS un dessin coupe en deux moities lisibles.
  C'est une ENIGME de fusion :

  D1  CHAQUE totem porte AU MOINS 3 elements DIFFERENTS qui CHEVAUCHENT
      la frontiere centre<->contour (haut y=78, bas y=168, gauche x=72,
      droite x=168). Jamais 1 seul element coupe : toujours 3+.
  D2  CHAQUE MOITIE EST ILLISIBLE SEULE. Vue isolee, une moitie doit
      EVOQUER AUTRE CHOSE (un arc anodin, un trait, un demi-cercle) et
      NON l'element final. Seule la fusion centre+contour reconstitue
      le motif -> force de DEDUCTION.
  D3  Les elements se CROISENT sur des bords DIFFERENTS (pas tous en
      haut) : on combine bord HAUT + bord BAS + un bord LATERAL, pour
      que la lecture demande de recomposer dans plusieurs directions.
  D4  decor neutre autorise (hors frontiere) mais il ne doit PAS livrer
      la solution.
  =====================================================================
  CONTRAINTES TECHNIQUES (rappel projet)
  R1 rien ne sort du cadre au repos        R2 viewBox 240, cadre rx18,
  centre rect x72 y78 w96 h90 rx18         R5 decor neutre
  R6 clipPath + classes                    R7 ne modifier que le demande
  =====================================================================
  v6 : 24 totems 6x4, base = v4. Separation .split PRESENTE mais PLUS
  declenchee au clic (deplacement des seuls carres-contours = plus tard).
-->
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { touch-action: none; }
    body {
        background-color: #14110d;
        background-image:
            radial-gradient(circle at 50% 12%, rgba(196,120,52,0.09), transparent 60%),
            radial-gradient(circle at 50% 96%, rgba(150,60,40,0.07), transparent 60%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 36px 0;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(4, var(--cell));
        gap: var(--gap);
        --cell: min(70px, 16vw);
        --gap: 8px;
    }
    .stage { position: relative; width: var(--cell); height: var(--cell); }
    .big, .small { position: absolute; inset: 0; transition: transform 0.55s cubic-bezier(.6,.05,.2,1); }
    .stage.split .big   { transform: translate(-52px, 0); }
    .stage.split .small { transform: translate(52px, 0); }

    .line   { stroke: #d9a066; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin   { stroke: #d9a066; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .border { stroke: rgba(217,160,102,0.30); stroke-width: 2; fill: none; }
    .fill   { fill: #d9a066; }
    .none   { fill: none; }
</style>
</head>

// ----------------------------------------------------------------------
// Rendu grille 4 colonnes x 6 lignes (24 totems)
// ----------------------------------------------------------------------
const COLS = 4, ROWS = 6, TOTAL = T.length;
const grid = document.getElementById('grid');

// bigOrder[cellIndex] = index du contenu .big affiche dans cette cellule.
// Les .small ne sont JAMAIS reordonnes : ils restent a leur cellule d'origine.
let bigOrder = T.map((_, i) => i);

function bigSVG(contentIdx) {
  return `<svg class="big" viewBox="0 0 240 240">${FRAME_BIG}${T[contentIdx].big}</svg>`;
}
function smallSVG(cellIdx) {
  return `<svg class="small" viewBox="0 0 240 240">${CENTER_BORDER}${T[cellIdx].small}</svg>`;
}

function render() {
  grid.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const stage = document.createElement('div');
    stage.className = 'stage';
    stage.dataset.index = i;
    stage.innerHTML = bigSVG(bigOrder[i]) + smallSVG(i);
    grid.appendChild(stage);
  }
}
render();

// ======================================================================
// Mouvement diagonal applique UNIQUEMENT aux carres externes (.big).
// Swipe diagonal -> rotation continue d'un bloc 2x2 de .big.
// Repris de fusion-square-5x5-mobile. Les .small restent fixes.
// ======================================================================
const ROTATION_SPEED = 800;
let isLocalRotating = false;
let dragState = null;

function getPos(i) { return { x: i % COLS, y: Math.floor(i / COLS) }; }
function getIndex(x, y) { return (x < 0 || x >= COLS || y < 0 || y >= ROWS) ? -1 : y * COLS + x; }

function detectDiag(dx, dy) {
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (ax < 15 || ay < 15 || ax / ay < 0.5 || ax / ay > 2) return null;
  return dy < 0 ? (dx > 0 ? 'ur' : 'ul') : (dx > 0 ? 'dr' : 'dl');
}

function getGroup(x, y, dir) {
  const offsets = { ur: [0, -1], ul: [-1, -1], dr: [0, 0], dl: [-1, 0] };
  const [ox, oy] = offsets[dir];
  const tx = x + ox, ty = y + oy;
  if (tx < 0 || tx > COLS - 2 || ty < 0 || ty > ROWS - 2) return null;
  return [getIndex(tx, ty), getIndex(tx + 1, ty), getIndex(tx, ty + 1), getIndex(tx + 1, ty + 1)];
}

function isClockwise(dir) { return dir === 'ur' || dir === 'dr'; }

function executeRotation(indices, clockwise) {
  if (isLocalRotating) return;
  isLocalRotating = true;

  const stages = Array.from(grid.children);
  const cells = indices.map((idx) => ({
    el: stages[idx].querySelector('.big'),
    sx: idx % COLS, sy: Math.floor(idx / COLS)
  }));
  // couper la transition CSS : l'anim est pilotee frame par frame en JS
  cells.forEach(c => { if (c.el) c.el.style.transition = 'none'; });

  const map = clockwise ? [2, 0, 3, 1] : [1, 3, 0, 2];
  cells.forEach((c, i) => {
    const ti = map[i];
    c.tx = indices[ti] % COLS;
    c.ty = Math.floor(indices[ti] / COLS);
  });

  const duration = ROTATION_SPEED * 0.5;
  const start = performance.now();
  const stageEl = grid.children[0];
  const cellSize = stageEl.offsetWidth;
  const gap = parseFloat(getComputedStyle(grid).gap) || 8;

  function animate(t) {
    const p = Math.min((t - start) / duration, 1);
    const e = 1 - Math.pow(1 - p, 3);
    cells.forEach(c => {
      if (c.el) {
        const dx = (c.tx - c.sx) * (cellSize + gap) * e;
        const dy = (c.ty - c.sy) * (cellSize + gap) * e;
        c.el.style.transform = `translate(${dx}px, ${dy}px)`;
      }
    });
    if (p < 1) requestAnimationFrame(animate);
    else finishRotation(indices, clockwise);
  }
  requestAnimationFrame(animate);
}

function finishRotation(indices, clockwise) {
  const map = clockwise ? [2, 0, 3, 1] : [1, 3, 0, 2];
  // permute UNIQUEMENT les contenus .big (bigOrder)
  const saved = indices.map(i => bigOrder[i]);
  for (let i = 0; i < 4; i++) bigOrder[indices[map[i]]] = saved[i];
  render();
  isLocalRotating = false;
}

function attemptRotation(x, y, dx, dy) {
  if (isLocalRotating) return false;
  const dir = detectDiag(dx, dy);
  if (!dir) return false;
  const group = getGroup(x, y, dir);
  if (!group) return false;
  executeRotation(group, isClockwise(dir));
  return true;
}

function handleStart(e) {
  const touch = e.touches?.[0] || e;
  const target = e.target.closest('.stage');
  if (!target) return;
  const idx = parseInt(target.dataset.index);
  const pos = getPos(idx);
  dragState = { x: pos.x, y: pos.y, sx: touch.clientX, sy: touch.clientY, moved: false };
  e.preventDefault();
}

function handleMove(e) {
  if (!dragState || dragState.moved) return;
  const touch = e.touches?.[0] || e;
  const dx = touch.clientX - dragState.sx, dy = touch.clientY - dragState.sy;
  if (detectDiag(dx, dy)) {
    dragState.moved = true;
    attemptRotation(dragState.x, dragState.y, dx, dy);
  }
  e.preventDefault();
}

function handleEnd() {
  dragState = null;
}

grid.addEventListener('mousedown', handleStart);
grid.addEventListener('touchstart', handleStart, { passive: false });
document.addEventListener('mousemove', handleMove);
document.addEventListener('touchmove', handleMove, { passive: false });
document.addEventListener('mouseup', handleEnd);
document.addEventListener('touchend', handleEnd);
</script>
